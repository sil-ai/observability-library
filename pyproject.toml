[project]
name = "observability-library"
version = "0.3.0"
description = "Loki logging + OpenTelemetry tracing helpers, with log↔trace correlation for Grafana"
authors = [
    {name = "Andres Quintero", email = "aquintero@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Repository = "https://github.com/sil-ai/observability-library"

[tool.setuptools.packages.find]
where = ["."]
include = ["observability_library*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
